
name: Generate Profile Animations

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Snake and Pac-Man
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare output folder
        run: |
          rm -rf dist
          mkdir -p dist
          chmod -R 777 dist

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: darshanhulagur12
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Prepare folder for Pac-Man
        run: |
          mkdir -p dist
          chmod -R 777 dist

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: darshanhulagur12
          games: "pacman"
          hide_month_labels: "false"

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
